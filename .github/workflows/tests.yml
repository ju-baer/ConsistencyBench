name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core dependencies (no torch — Part A only, CI has no GPU)
        run: |
          python -m pip install --upgrade pip
          pip install openai tenacity tqdm pandas numpy scipy scikit-learn \
                      matplotlib seaborn krippendorff pytest pytest-cov ruff

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Unit tests (network- and GPU-free by design — see CONTRIBUTING.md)
        run: PYTHONPATH=src pytest tests/ -v --cov=consistencybench --cov-report=term-missing
