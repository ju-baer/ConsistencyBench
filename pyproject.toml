[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consistencybench"
version = "1.0.0"
description = "A constraint-preserving framework for evaluating logical consistency as a first-class property of language models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ConsistencyBench Contributors" }]
keywords = [
    "llm-evaluation", "logical-consistency", "benchmark",
    "interpretability", "activation-patching", "mechanistic-interpretability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.30",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "krippendorff>=0.6",
    "sentence-transformers>=2.6",
    "huggingface_hub>=0.23",
    "datasets>=2.19",
]

[project.optional-dependencies]
interpretability = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "einops>=0.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/ConsistencyBench"
Repository = "https://github.com/YOUR_USERNAME/ConsistencyBench"
Issues = "https://github.com/YOUR_USERNAME/ConsistencyBench/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E702", "E741", "E731"]
